name: 繳款提醒

on:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 01:00 = 台灣時間 09:00（GitHub 偶爾會晚幾分鐘）
  workflow_dispatch:
    inputs:
      test:
        description: '送一則測試通知給所有裝置'
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/send-reminders.mjs
        env:
          TZ: Asia/Taipei
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST: ${{ inputs.test && '1' || '' }}
